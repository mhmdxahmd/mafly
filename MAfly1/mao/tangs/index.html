<script>
"use strict";

/* =========================================================
   全局数据
========================================================= */

let originalText = "";
let workText = "";

let historyStack = [];

let currentPage = "sites";

let sourceRows = [];
let vodRows = [];

let pushUrl = "";

let modalType = "";
let modalIndex = -1;


/* =========================================================
   内置站源名称
========================================================= */

const SOURCE_LABELS = {

    douban: "豆瓣",

    "360": "360",

    renren: "人人",

    hanjutv: "韩剧TV",

    tencent: "腾讯",

    youku: "优酷",

    iqiyi: "爱奇艺",

    imgo: "芒果",

    bilibili: "哔哩哔哩",

    migu: "咪咕",

    sohu: "搜狐",

    leshi: "乐视",

    xigua: "西瓜",

    maiduidui: "麦豆豆",

    aiyifan: "爱壹帆",

    hongguo: "红果",

    dandan: "蛋蛋",

    bahamut: "巴哈姆特",

    animeko: "Animeko",

    tmdb: "TMDB",

    vod: "VOD",

    custom: "自定义"

};

const ALL_SOURCE_IDS =
    Object.keys(SOURCE_LABELS);


/* =========================================================
   DOM 快捷方法
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   HTML 转义
========================================================= */

function esc(value){

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    ).replace(
        /[&<>"']/g,
        function(char){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            };

            return map[char];

        }
    );

}


/* =========================================================
   JS 字符串
========================================================= */

function jsQuote(value){

    return JSON.stringify(
        String(
            value === null ||
            value === undefined
                ? ""
                : value
        )
    );

}


/* =========================================================
   状态
========================================================= */

function setStatus(text){

    $("status").textContent = text;

}


/* =========================================================
   历史记录
========================================================= */

function pushHistory(){

    historyStack.push(workText);

    if(historyStack.length > 50){

        historyStack.shift();

    }

}


/* =========================================================
   撤销
========================================================= */

function undo(){

    if(!historyStack.length){

        alert("没有可以撤销的操作。");

        return;

    }

    workText =
        historyStack.pop();

    parseAll();

    render();

    setStatus(
        "已撤销上一项修改。"
    );

}


/* =========================================================
   恢复原始
========================================================= */

function restoreOriginal(){

    if(!originalText){

        alert("当前没有原始文件。");

        return;

    }

    if(
        !confirm(
            "确定恢复原始 index.js？\n\n当前所有修改都会丢失。"
        )
    ){

        return;

    }

    workText =
        originalText;

    historyStack = [];

    parseAll();

    render();

    setStatus(
        "已经恢复原始 index.js。"
    );

}


/* =========================================================
   本地文件选择
========================================================= */

$("fileInput").addEventListener(
    "change",
    function(){

        const file =
            $("fileInput").files[0];

        if(!file){

            $("fileName").textContent =
                "尚未选择文件";

            return;

        }

        $("fileName").textContent =
            file.name +
            " · " +
            formatBytes(file.size);

        setStatus(
            "已选择 " +
            file.name +
            "，请点击“本地导入”。"
        );

    }
);


/* =========================================================
   本地导入
========================================================= */

$("localImportBtn").addEventListener(
    "click",
    async function(){

        const file =
            $("fileInput").files[0];

        if(!file){

            alert(
                "请先点击“选择原始 index.js”选择文件。"
            );

            return;

        }

        try{

            setStatus(
                "正在读取本地 index.js……"
            );

            const text =
                await file.text();

            loadIndexText(
                text,
                "本地：" + file.name
            );

        }catch(error){

            console.error(error);

            alert(
                "本地导入失败：\n" +
                error.message
            );

            setStatus(
                "本地导入失败。"
            );

        }

    }
);


/* =========================================================
   URL 导入
========================================================= */

$("urlImportBtn").addEventListener(
    "click",
    async function(){

        const url =
            $("urlInput").value.trim();

        if(!url){

            alert(
                "请输入 index.js URL。"
            );

            return;

        }

        try{

            setStatus(
                "正在通过 URL 下载 index.js……"
            );

            const response =
                await fetch(
                    url,
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }

            const text =
                await response.text();

            loadIndexText(
                text,
                "URL：" + url
            );

        }catch(error){

            console.error(error);

            alert(
                "URL 导入失败：\n\n" +
                error.message +
                "\n\n" +
                "如果出现 Failed to fetch，通常是目标服务器没有开放 CORS。\n\n" +
                "这种情况下请先用浏览器下载 index.js，然后选择文件进行本地导入。"
            );

            setStatus(
                "URL 导入失败。"
            );

        }

    }
);


/* =========================================================
   加载文件
========================================================= */

function loadIndexText(
    text,
    source
){

    if(
        !text ||
        text.length < 100
    ){

        alert(
            "导入内容太短，不像有效的 index.js。"
        );

        return;

    }

    originalText =
        text;

    workText =
        text;

    historyStack = [];

    parseAll();

    render();

    setStatus(
        "导入成功 · " +
        source +
        " · " +
        text.length.toLocaleString() +
        " 字符"
    );

}


/* =========================================================
   查找 this.get("KEY", DEFAULT)
========================================================= */

function findGetDefault(key){

    let position =
        workText.indexOf(
            'this.get("' +
            key +
            '"'
        );

    if(position < 0){

        position =
            workText.indexOf(
                "this.get('" +
                key +
                "'"
            );

    }

    if(position < 0){

        return null;

    }

    const comma =
        workText.indexOf(
            ",",
            position
        );

    if(comma < 0){

        return null;

    }

    let start =
        comma + 1;

    while(
        start < workText.length &&
        /\s/.test(
            workText[start]
        )
    ){

        start++;

    }

    const first =
        workText[start];

    if(
        first === '"' ||
        first === "'"
    ){

        const quoteChar =
            first;

        let end =
            start + 1;

        let escaped =
            false;

        while(
            end < workText.length
        ){

            const char =
                workText[end];

            if(escaped){

                escaped = false;

                end++;

                continue;

            }

            if(char === "\\"){

                escaped = true;

                end++;

                continue;

            }

            if(
                char === quoteChar
            ){

                break;

            }

            end++;

        }

        if(
            end >= workText.length
        ){

            return null;

        }

        const raw =
            workText.slice(
                start,
                end + 1
            );

        let value = "";

        try{

            value =
                JSON.parse(raw);

        }catch(error){

            value =
                raw.slice(
                    1,
                    -1
                );

        }

        return {

            start:start,

            end:end + 1,

            value:value

        };

    }


    let depth = 0;

    let quoteChar = "";

    let escaped = false;

    for(
        let i = start;
        i < workText.length;
        i++
    ){

        const char =
            workText[i];

        if(quoteChar){

            if(escaped){

                escaped = false;

                continue;

            }

            if(char === "\\"){

                escaped = true;

                continue;

            }

            if(char === quoteChar){

                quoteChar = "";

            }

            continue;

        }

        if(
            char === '"' ||
            char === "'"
        ){

            quoteChar =
                char;

            continue;

        }

        if(
            char === "(" ||
            char === "[" ||
            char === "{"
        ){

            depth++;

            continue;

        }

        if(
            char === ")" ||
            char === "]" ||
            char === "}"
        ){

            depth--;

            continue;

        }

        if(
            char === "," &&
            depth === 0
        ){

            return {

                start:start,

                end:i,

                value:
                    workText
                        .slice(
                            start,
                            i
                        )
                        .trim()

            };

        }

    }

    return null;

}


/* =========================================================
   CSV
========================================================= */

function parseCsv(value){

    return String(
        value || ""
    )
    .split(",")
    .map(
        function(item){

            return item.trim();

        }
    )
    .filter(
        function(item){

            return !!item;

        }
    );

}


/* =========================================================
   SOURCE_ORDER
========================================================= */

function parseSourceOrder(){

    const result = [];

    const found =
        findGetDefault(
            "SOURCE_ORDER"
        );

    const enabled =
        found
            ? parseCsv(found.value)
            : [];

    const seen =
        new Set();

    enabled.forEach(
        function(id){

            if(
                !seen.has(id)
            ){

                result.push({

                    id:id,

                    name:
                        SOURCE_LABELS[id] ||
                        id,

                    enabled:true

                });

                seen.add(id);

            }

        }
    );


    /*
       把允许的全部站源补进来。

       不在 SOURCE_ORDER
       的站源默认显示为停用。
    */

    ALL_SOURCE_IDS.forEach(
        function(id){

            if(
                !seen.has(id)
            ){

                result.push({

                    id:id,

                    name:
                        SOURCE_LABELS[id] ||
                        id,

                    enabled:false

                });

            }

        }
    );

    return result;

}


/* =========================================================
   找 VOD_SERVERS
========================================================= */

function findVodRange(){

    let position =
        workText.indexOf(
            'this.get("VOD_SERVERS"'
        );

    if(position < 0){

        position =
            workText.indexOf(
                "this.get('VOD_SERVERS'"
            );

    }

    if(position < 0){

        return null;

    }

    const comma =
        workText.indexOf(
            ",",
            position
        );

    if(comma < 0){

        return null;

    }

    let start =
        comma + 1;

    while(
        start < workText.length &&
        /\s/.test(
            workText[start]
        )
    ){

        start++;

    }

    const first =
        workText[start];

    if(
        first !== '"' &&
        first !== "'"
    ){

        return null;

    }

    const quoteChar =
        first;

    let end =
        start + 1;

    let escaped =
        false;

    while(
        end < workText.length
    ){

        const char =
            workText[end];

        if(escaped){

            escaped = false;

            end++;

            continue;

        }

        if(char === "\\"){

            escaped = true;

            end++;

            continue;

        }

        if(
            char === quoteChar
        ){

            break;

        }

        end++;

    }

    if(
        end >= workText.length
    ){

        return null;

    }

    const raw =
        workText.slice(
            start,
            end + 1
        );

    let value = "";

    try{

        value =
            JSON.parse(raw);

    }catch(error){

        value =
            raw.slice(
                1,
                -1
            );

    }

    return {

        start:start,

        end:end + 1,

        value:value

    };

}


/* =========================================================
   VOD
========================================================= */

function parseVod(){

    const result = [];

    const range =
        findVodRange();

    if(!range){

        return result;

    }

    parseCsv(
        range.value
    ).forEach(
        function(item,index){

            const at =
                item.indexOf("@");

            if(at >= 0){

                result.push({

                    name:
                        item.slice(
                            0,
                            at
                        ) ||
                        "站源 " +
                        (index + 1),

                    url:
                        item.slice(
                            at + 1
                        ),

                    enabled:true

                });

            }else{

                result.push({

                    name:
                        "站源 " +
                        (index + 1),

                    url:item,

                    enabled:true

                });

            }

        }
    );

    result._range =
        range;

    return result;

}

document.addEventListener(
    "change",
    function(event){

        const target =
            event.target;


        if(
            target.classList.contains(
                "sourceCheck"
            )
        ){

            const index =
                Number(
                    target.dataset.index
                );

            pushHistory();

            sourceRows[index]
                .enabled =
                target.checked;

            render();

            return;

        }


        if(
            target.classList.contains(
                "vodCheck"
            )
        ){

            const index =
                Number(
                    target.dataset.index
                );

            pushHistory();

            vodRows[index]
                .enabled =
                target.checked;

            render();

        }

    }
);


document.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button"
            );

        if(!button){

            return;

        }


        if(
            button.dataset.sourceAction
        ){

            const action =
                button.dataset.sourceAction;

            const index =
                Number(
                    button.dataset.index
                );


            if(action === "up"){

                moveSource(
                    index,
                    -1
                );

            }

            if(action === "down"){

                moveSource(
                    index,
                    1
                );

            }

            if(action === "edit"){

                editSource(index);

            }

            if(action === "delete"){

                deleteSource(index);

            }

        }


        if(
            button.dataset.vodAction
        ){

            const action =
                button.dataset.vodAction;

            const index =
                Number(
                    button.dataset.index
                );


            if(action === "up"){

                moveVod(
                    index,
                    -1
                );

            }

            if(action === "down"){

                moveVod(
                    index,
                    1
                );

            }

            if(action === "edit"){

                editVod(index);

            }

            if(action === "delete"){

                deleteVod(index);

            }

        }

    }
);

    index,
    direction
){

    const newIndex =
        index + direction;

        newIndex < 0 ||
        newIndex >= sourceRows.length
    ){

        return;

    }

    pushHistory();

    const temp =
        sourceRows[index];

    sourceRows[index] =
        sourceRows[newIndex];

    sourceRows[newIndex] =
        temp;

    render();

}

/* =========================================================
保存全部站源
========================================================= */

function saveAllSources(){

```
if(!workText){

    alert(
        "请先导入 index.js。"
    );

    return;

}


pushHistory();


/*
   SOURCE_ORDER
*/

const orderFound =
    findGetDefault(
        "SOURCE_ORDER"
    );


if(orderFound){

    const order =
        sourceRows
            .filter(
                function(item){

                    return item.enabled;

                }
            )
            .map(
                function(item){

                    return item.id;

                }
            )
            .join(",");


    workText =

        workText.slice(
            0,
            orderFound.start
        ) +

        jsQuote(order) +

        workText.slice(
            orderFound.end
        );

}


/*
   VOD_SERVERS

   重新定位，因为前面
   SOURCE_ORDER 替换过一次。
*/

const vodRange =
    findVodRange();


if(vodRange){

    const vodValue =
        vodRows
            .filter(
                function(item){

                    return item.enabled;

                }
            )
            .map(
                function(item){

                    return (
                        item.name +
                        "@" +
                        item.url
                    );

                }
            )
            .join(",");


    workText =

        workText.slice(
            0,
            vodRange.start
        ) +

        jsQuote(vodValue) +

        workText.slice(
            vodRange.end
        );

}


parseAll();

render();

setStatus(
    "站源修改已经写回最终 index.js。"
);
```

}

/* =========================================================
MD5
========================================================= */

function md5(bytes){

```
function rol(
    value,
    bits
){

    return (
        value << bits
    ) |
    (
        value >>>
        (32 - bits)
    );

}


function add(
    a,
    b
){

    return (
        (
            (a >>> 0) +
            (b >>> 0)
        ) >>> 0
    );

}


function F(
    x,
    y,
    z
){

    return (
        x & y
    ) |
    (
        ~x & z
    );

}


function G(
    x,
    y,
    z
){

    return (
        x & z
    ) |
    (
        y & ~z
    );

}


function H(
    x,
    y,
    z
){

    return x ^ y ^ z;

}


function I(
    x,
    y,
    z
){

    return y ^ (
        x |
        ~z
    );

}


const length =
    bytes.length;


const blocks =
    Math.ceil(
        (
            length +
            9
        ) /
        64
    );


const buffer =
    new Uint8Array(
        blocks * 64
    );


buffer.set(
    bytes
);


buffer[length] =
    128;


const dataView =
    new DataView(
        buffer.buffer
    );


const bitLength =
    length * 8;


dataView.setUint32(
    buffer.length - 8,
    bitLength >>> 0,
    true
);


dataView.setUint32(
    buffer.length - 4,
    Math.floor(
        bitLength /
        4294967296
    ),
    true
);


const K = [];

const S1 =
    [
        7,
        12,
        17,
        22
    ];

const S2 =
    [
        5,
        9,
        14,
        20
    ];

const S3 =
    [
        4,
        11,
        16,
        23
    ];

const S4 =
    [
        6,
        10,
        15,
        21
    ];


for(
    let i = 0;
    i < 64;
    i++
){

    K[i] =
        Math.floor(
            Math.abs(
                Math.sin(
                    i + 1
                )
            ) *
            4294967296
        ) >>> 0;

}


let a0 =
    0x67452301;

let b0 =
    0xefcdab89;

let c0 =
    0x98badcfe;

let d0 =
    0x10325476;


for(
    let offset = 0;
    offset < buffer.length;
    offset += 64
){

    const M = [];


    for(
        let j = 0;
        j < 16;
        j++
    ){

        M[j] =
            dataView.getUint32(
                offset +
                j * 4,
                true
            );

    }


    let a = a0;

    let b = b0;

    let c = c0;

    let d = d0;


    for(
        let i = 0;
        i < 64;
        i++
    ){

        let f;

        let g;

        let s;


        if(i < 16){

            f =
                F(
                    b,
                    c,
                    d
                );

            g = i;

            s =
                S1[
                    i & 3
                ];

        }else if(i < 32){

            f =
                G(
                    b,
                    c,
                    d
                );

            g =
                (
                    5 * i +
                    1
                ) & 15;

            s =
                S2[
                    i & 3
                ];

        }else if(i < 48){

            f =
                H(
                    b,
                    c,
                    d
                );

            g =
                (
                    3 * i +
                    5
                ) & 15;

            s =
                S3[
                    i & 3
                ];

        }else{

            f =
                I(
                    b,
                    c,
                    d
                );

            g =
                (
                    7 * i
                ) & 15;

            s =
                S4[
                    i & 3
                ];

        }


        const oldD =
            d;


        const temp =
            add(
                add(
                    a,
                    f
                ),
                add(
                    K[i],
                    M[g]
                )
            );


        d = c;

        c = b;

        b =
            add(
                b,
                rol(
                    temp,
                    s
                )
            );

        a =
            oldD;

    }


    a0 =
        add(
            a0,
            a
        );

    b0 =
        add(
            b0,
            b
        );

    c0 =
        add(
            c0,
            c
        );

    d0 =
        add(
            d0,
            d
        );

}


const words = [
    a0,
    b0,
    c0,
    d0
];


let result = "";


words.forEach(
    function(word){

        for(
            let i = 0;
            i < 4;
            i++
        ){

            result +=
                (
                    "0" +
                    (
                        (
                            word >>>
                            (
                                8 * i
                            )
                        ) &
                        255
                    ).toString(16)
                ).slice(-2);

        }

    }
);


return result;
```

}

/* =========================================================
生成 index.js + index.js.md5
========================================================= */

function saveAndDownload(){

```
if(!workText){

    alert(
        "请先导入 index.js。"
    );

    return;

}


/*
   在下载之前自动保存一次
   SOURCE_ORDER + VOD_SERVERS。
*/

saveAllSources();


/*
   saveAllSources 会 render，
   此时 workText 就是最终版本。
*/

const bytes =
    new TextEncoder()
        .encode(
            workText
        );


const checksum =
    md5(bytes);


/*
   下载 index.js
*/

const indexBlob =
    new Blob(
        [
            bytes
        ],
        {
            type:
                "application/javascript"
        }
    );


const indexUrl =
    URL.createObjectURL(
        indexBlob
    );


const indexLink =
    document.createElement(
        "a"
    );


indexLink.href =
    indexUrl;

indexLink.download =
    "index.js";

document.body.appendChild(
    indexLink
);

indexLink.click();

indexLink.remove();


setTimeout(
    function(){

        URL.revokeObjectURL(
            indexUrl
        );

    },
    2000
);


/*
   下载 MD5
*/

const md5Text =
    checksum +
    "  index.js\n";


const md5Blob =
    new Blob(
        [
            md5Text
        ],
        {
            type:
                "text/plain"
        }
    );


const md5Url =
    URL.createObjectURL(
        md5Blob
    );


const md5Link =
    document.createElement(
        "a"
    );


md5Link.href =
    md5Url;

md5Link.download =
    "index.js.md5";

document.body.appendChild(
    md5Link
);

setTimeout(
    function(){

        md5Link.click();

        md5Link.remove();

        URL.revokeObjectURL(
            md5Url
        );

    },
    500
);


setStatus(
    "生成完成 · index.js + index.js.md5 · MD5：" +
    checksum
);
```

}

function formatBytes(bytes){

```
if(bytes < 1024){

    return bytes +
        " B";

}


if(bytes < 1024 * 1024){

    return (
        bytes /
        1024
    ).toFixed(2) +
    " KB";

}


return (
    bytes /
    1024 /
    1024
).toFixed(2) +
" MB";
