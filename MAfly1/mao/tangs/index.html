<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫源配置中心 V3.1 · 全站源编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf7;font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial}
.app{display:flex;height:100vh;overflow:hidden}.side{width:245px;background:#11182b;border-right:1px solid #26314d;padding:18px;overflow:auto}
.logo{font-size:20px;font-weight:800;margin-bottom:4px}.sub{color:#8491ad;font-size:12px;margin-bottom:18px}
button,.file{border:1px solid #34415f;background:#17223a;color:#e8edf7;border-radius:9px;padding:9px 12px;cursor:pointer}
button:hover,.file:hover{background:#202e4d}.primary{background:#3157d5;border-color:#466be6}.danger{background:#5d2430;border-color:#8d3445}.green{background:#184c3b;border-color:#2d775d}
input,select,textarea{width:100%;background:#0e1628;border:1px solid #2b3855;color:#e8edf7;border-radius:8px;padding:9px;outline:none}
input:focus,textarea:focus{border-color:#5578e9}.nav{margin-top:15px}.nav button{width:100%;text-align:left;margin:4px 0;background:transparent}
.nav button.active{background:#26375d;border-color:#4667b7}.main{flex:1;overflow:auto;padding:24px;max-width:1500px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.title{font-size:24px;font-weight:800}.muted{color:#8d9ab4}
.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:#111a2e;border:1px solid #263451;border-radius:14px;padding:16px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .grow{flex:1}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#26375d;color:#b9c9ff;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:#3157d5}
.source{display:grid;grid-template-columns:34px 34px 1fr 1fr auto;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #24304a}
.source:first-child{border-top:1px solid #24304a}.source.off{opacity:.48}.source .name{font-weight:700}.url{font-family:ui-monospace,monospace;font-size:12px;color:#9fb0cf;word-break:break-all}
.small{padding:6px 8px;font-size:12px}.check{width:18px;height:18px}.empty{padding:35px;text-align:center;color:#7e8aa4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #24304a;vertical-align:top}th{color:#9eabc4}
pre{white-space:pre-wrap;word-break:break-all;max-height:380px;overflow:auto;background:#0a1120;padding:12px;border-radius:10px}
@media(max-width:850px){.side{width:190px}.grid{grid-template-columns:1fr}.source{grid-template-columns:30px 30px 1fr auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">🐱 猫源配置中心</div>
  <div class="sub">V3.1 · 完整站源管理</div>
  <label class="file">📂 打开 index.js<input id="file" type="file" accept=".js,.txt" hidden></label>
  <div style="height:8px"></div>
  <button onclick="loadFromPaste()">📋 粘贴 JS 文本</button>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <div class="top">
    <div>
      <div class="title" id="pageTitle">等待加载 index.js</div>
      <div class="muted" id="status">先选择原始 index.js；工具只做文本级精确修改，不执行文件。</div>
    </div>
    <div class="actions">
      <button onclick="undo()">↶ 撤销</button>
      <button onclick="restore()">恢复原始</button>
      <button class="primary" onclick="downloadAll()">💾 保存 index.js + MD5</button>
    </div>
  </div>
  <div id="content"></div>
</main>
</div>
<script>
let original='', work='', active='sites', history=[], siteRows=[], vodRows=[], sourceDefs=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(x){$('#status').textContent=x}
$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;original=work=await f.text();history=[];parseAll();render();setStatus('已加载 '+f.name+' · '+work.length.toLocaleString()+' 字符')};

async function loadFromPaste(){
 const t=prompt('把 index.js 全文粘贴到下面输入框。文件很大时建议直接选择文件。');
 if(t){original=work=t;history=[];parseAll();render()}
}
function snapshot(){history.push(work);if(history.length>30)history.shift()}
function undo(){if(!history.length)return;work=history.pop();parseAll();render();setStatus('已撤销上一项修改')}
function restore(){if(!original)return;if(!confirm('恢复原始 index.js？当前修改会全部丢失。'))return;work=original;history=[];parseAll();render()}

function findMatching(s,pos,open='{',close='}'){
 let d=0,q=null,escp=false,line=false,block=false;
 for(let i=pos;i<s.length;i++){let c=s[i],n=s[i+1];
  if(line){if(c==='\\n')line=false;continue}
  if(block){if(c==='*'&&n==='/'){block=false;i++}continue}
  if(q){if(escp)escp=false;else if(c==='\\\\')escp=true;else if(c===q)q=null;continue}
  if(c==='/ '){continue}
  if(c==='/'&&n==='/'){line=true;i++;continue}
  if(c==='/'&&n==='*'){block=true;i++;continue}
  if(c==='\"'||c==="'"||c==='`'){q=c;continue}
  if(c===open)d++; else if(c===close){d--;if(d===0)return i}
 }
 return -1
}
function jsUnquote(x){try{return JSON.parse(x)}catch(e){return x.replace(/^['"]|['"]$/g,'').replace(/\\\\/g,'\\').replace(/\\"/g,'"').replace(/\\'/g,"'")}}
function quote(s){return JSON.stringify(String(s))}
function getStringAfter(text, marker, from=0){
 let p=text.indexOf(marker,from); if(p<0)return null;
 let q=text.indexOf('"',p+marker.length); if(q<0)return null;
 let e=q+1,slash=false;for(;e<text.length;e++){let c=text[e];if(slash){slash=false;continue}if(c==='\\\\'){slash=true;continue}if(c==='"')break}
 return {value:jsUnquote(text.slice(q,e+1)),start:q,end:e+1}
}
function findGetDefault(key){
 const re=new RegExp('this\\\\.get\\\\(\\\\s*["\\\\']'+key.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+'["\\\\']\\\\s*,\\\\s*');
 let m=re.exec(work);if(!m)return null;
 let p=m.index+m[0].length,q=p;
 if(work[q]==='"'||work[q]==="'"){let ch=work[q],i=q+1,sl=false;for(;i<work.length;i++){let c=work[i];if(sl){sl=false;continue}if(c==='\\\\'){sl=true;continue}if(c===ch)break}return {value:jsUnquote(work.slice(q,i+1)),start:q,end:i+1}}
 let depth=0,i=q,qq=null,sl=false;
 for(;i<work.length;i++){let c=work[i];if(qq){if(sl)sl=false;else if(c==='\\\\')sl=true;else if(c===qq)qq=null;continue}
  if(c==='\"'||c==="'"){qq=c;continue} if(c==='('||c==='['||c==='{')depth++; if(c===')'||c===']'||c==='}')depth--; if(depth===0&&c===',')break}
 return {value:work.slice(q,i).trim(),start:q,end:i}
}
function parseCSV(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}
function parseAll(){parseSources();parseVod();parseConfigCounts()}
function parseSources(){
 sourceDefs=[]; let x=findGetDefault('SOURCE_ORDER'); if(x){parseCSV(x.value).forEach(v=>sourceDefs.push({id:v,name:v,enabled:true}))}
 // Allowed sources from the original source, if present. Add every allowed source so the UI can configure all of them.
 const m=work.match(/ALLOWED_SOURCES\\s*=\\s*\\[([\\s\\S]*?)\\]/);
 if(m){let a=[...m[1].matchAll(/["']([^"']+)["']/g)].map(z=>z[1]);for(const id of a)if(!sourceDefs.some(x=>x.id===id))sourceDefs.push({id,name:id,enabled:false})}
}
function parseVod(){
 vodRows=[];let re=/static\\s+resolveVodServers\\(\\)\\s*\\{[\\s\\S]*?this\\.get\\(\\s*["']VOD_SERVERS["']\\s*,\\s*/m,m=re.exec(work);if(!m)return;
 let p=m.index+m[0].length,q=p;
 while(q<work.length&&/\\s/.test(work[q]))q++;
 let val='',start=q,end=q;
 if(work[q]==='"'||work[q]==="'"){let ch=work[q],i=q+1,sl=false;for(;i<work.length;i++){let c=work[i];if(sl){sl=false;continue}if(c==='\\\\'){sl=true;continue}if(c===ch)break}val=jsUnquote(work.slice(q,i+1));start=q;end=i+1}
 else return;
 parseCSV(val).forEach((v,i)=>{let k=v.indexOf('@');vodRows.push({name:k>=0?v.slice(0,k):'站源 '+(i+1),url:k>=0?v.slice(k+1):v,enabled:true})});
 vodRows._range={start,end,value:val};
}
function parseConfigCounts(){
 let counts={api:0,source:0,match:0,danmu:0,cache:0,system:0};
 const keys=[...work.matchAll(/this\\.get\\(\\s*["']([A-Z][A-Z0-9_]+)["']/g)].map(x=>x[1]);
 const sourceKeys=new Set(['SOURCE_ORDER','MERGE_SOURCE_PAIRS','CUSTOM_MERGE_RULES','OTHER_SERVER','CUSTOM_SOURCE_API_URL','VOD_SERVERS','VOD_RETURN_MODE','VOD_REQUEST_TIMEOUT','BILIBILI_COOKIE','DOUBAN_COOKIE','YOUKU_CONCURRENCY']);
 keys.forEach(k=>{if(sourceKeys.has(k))counts.source++;else if(/^DANMU|^BLOCKED|^GROUP_MINUTE|^LIKE|^COLOR|^GRADIENT|^HONGGUO/.test(k))counts.danmu++;else if(/^AI_|^PLATFORM|^TITLE|^ANIME|^EPISODE|^STRICT|^USE_BANGUMI/.test(k))counts.match++;else if(/^CACHE|^SEARCH_CACHE|^COMMENT_CACHE|^BANGUMI_DATA_CACHE|^REMEMBER|^MAX_ANIMES|^UPSTASH|^LOCAL_REDIS/.test(k))counts.cache++;else if(/^UI_|^LOG_|^PROXY_|^TMDB_|^DEPLOY_|^TOKEN|^RATE_LIMIT|^ADMIN/.test(k))counts.api++;else counts.system++});
 return counts
}
function navRender(){
 let c=parseConfigCounts(), items=[
  ['sites','🌐 站源列表',siteRows.length+sourceDefs.length],
  ['vod','📺 VOD/采集站',vodRows.length],
  ['order','📑 站源顺序',sourceDefs.length],
  ['brand','📣 品牌/公众号',''],
  ['config','⚙️ 当前配置项','']
 ];
 $('#nav').innerHTML=items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="active='${x[0]}';render()">${x[1]} ${x[2]!==''?`<span class=badge>${x[2]}</span>`:''}</button>`).join('');
}
function render(){navRender();if(!work){$('#content').innerHTML='<div class=card><div class=empty>请先打开原始 index.js</div></div>';return}
 $('#pageTitle').textContent={sites:'全部站源列表',vod:'VOD / 采集站列表',order:'站源启用与排序',brand:'品牌与公众号文字',config:'当前分类配置'}[active];
 if(active==='sites')renderSites();else if(active==='vod')renderVod();else if(active==='order')renderOrder();else if(active==='brand')renderBrand();else renderConfig();
}
function renderSites(){
 let all=[...sourceDefs.map(x=>({kind:'source',id:x.id,name:x.id,url:'内置站源 · '+x.id,enabled:x.enabled})),...vodRows.map((x,i)=>({kind:'vod',id:'vod-'+i,name:x.name,url:x.url,enabled:x.enabled}))];
 $('#content').innerHTML=`<div class=card><div class=toolbar><input id=filter class=grow placeholder="搜索站源名称 / URL / ID"><button onclick="addSource()">＋添加站源</button><button class=green onclick="saveAllSources()">💾 保存全部站源</button></div><div class=muted>这里显示完整可管理的站源：内置 SOURCE_ORDER + VOD_SERVERS。每一项都可以启用、停用、修改、删除、上移、下移。</div></div><div class=card id=list></div>`;
 drawSiteList(all);
 $('#filter').oninput=e=>drawSiteList(all,e.target.value);
}
function drawSiteList(all,filter=''){
 let a=all.filter(x=>(x.name+' '+x.url+' '+x.id).toLowerCase().includes(filter.toLowerCase()));
 $('#list').innerHTML=a.length?a.map((x,i)=>`<div class="source ${x.enabled?'':'off'}">
 <input class=check type=checkbox ${x.enabled?'checked':''} onchange="toggleAny('${esc(x.kind)}','${esc(x.id)}',this.checked)">
 <div class=url>${x.kind==='vod'?'VOD':'内置'}</div>
 <div><div class=name>${esc(x.name)}</div><div class=url>${esc(x.url)}</div></div>
 <input value="${esc(x.name)}" onchange="renameAny('${esc(x.kind)}','${esc(x.id)}',this.value)" title="修改名称">
 <div class=row style="flex:0 0 auto"><button class=small onclick="moveAny('${esc(x.kind)}','${esc(x.id)}',-1)">↑</button><button class=small onclick="moveAny('${esc(x.kind)}','${esc(x.id)}',1)">↓</button><button class=small onclick="editAny('${esc(x.kind)}','${esc(x.id)}')">编辑</button><button class="small danger" onclick="deleteAny('${esc(x.kind)}','${esc(x.id)}')">删除</button></div>
 </div>`).join(''):'<div class=empty>没有匹配的站源</div>';
}
function idxById(kind,id){return kind==='vod'?vodRows.findIndex((x,i)=>'vod-'+i===id):sourceDefs.findIndex(x=>x.id===id)}
function toggleAny(kind,id,on){let i=idxById(kind,id);if(i<0)return;snapshot();(kind==='vod'?vodRows[i]:sourceDefs[i]).enabled=on;render()}
function renameAny(kind,id,v){let i=idxById(kind,id);if(i<0)return;snapshot();(kind==='vod'?vodRows[i]:sourceDefs[i]).name=v; if(kind==='source')sourceDefs[i].id=v; render()}
function moveAny(kind,id,d){let i=idxById(kind,id),a=kind==='vod'?vodRows:sourceDefs;if(i<0)return;let j=i+d;if(j<0||j>=a.length)return;snapshot();[a[i],a[j]]=[a[j],a[i]];render()}
function deleteAny(kind,id){let i=idxById(kind,id);if(i<0||!confirm('确定删除这个站源？'))return;snapshot();(kind==='vod'?vodRows:sourceDefs).splice(i,1);render()}
function editAny(kind,id){
 let i=idxById(kind,id);if(i<0)return;
 if(kind==='vod'){let x=vodRows[i],name=prompt('站源名称',x.name),url=prompt('站源 URL',x.url);if(name===null||url===null)return;snapshot();x.name=name;x.url=url}
 else {let x=sourceDefs[i],v=prompt('站源 ID / 名称',x.id);if(v===null||!v.trim())return;snapshot();x.id=v.trim();x.name=v.trim()}
 render()
}
function addSource(){
 let kind=prompt('添加类型：输入 1=VOD采集站，2=内置站源','1');if(kind===null)return;
 if(kind==='1'){let name=prompt('名称');let url=prompt('URL');if(!name||!url)return;snapshot();vodRows.push({name,url,enabled:true})}
 else {let id=prompt('内置站源 ID，例如 custom');if(!id)return;snapshot();sourceDefs.push({id:id.trim(),name:id.trim(),enabled:true})}
 render()
}
function saveAllSources(){
 if(!work)return;snapshot();
 // SOURCE_ORDER：只保存启用项，顺序以当前内置列表为准。
 let so=sourceDefs.filter(x=>x.enabled).map(x=>x.id).join(',');
 let g=findGetDefault('SOURCE_ORDER');if(g)work=work.slice(0,g.start)+quote(so)+work.slice(g.end);
 // VOD_SERVERS：只保存启用项，按当前顺序保存。
 let rg=vodRows._range;
 // refresh range after SOURCE_ORDER replacement
 parseVod(); rg=vodRows._range;
 let vo=vodRows.filter(x=>x.enabled).map(x=>x.name+'@'+x.url).join(',');
 if(rg)work=work.slice(0,rg.start)+quote(vo)+work.slice(rg.end);
 parseAll();render();setStatus('站源列表已写回 index.js；未点击下载前原文件不会被覆盖。')
}
function renderVod(){
 $('#content').innerHTML=`<div class=card><div class=toolbar><span class=badge>VOD_SERVERS</span><button onclick="addVod()">＋添加</button><button class=green onclick="saveVodOnly()">💾 保存 VOD</button></div><div class=muted>这里对应原 index.js 的 VOD_SERVERS。停用项不会写入最终默认列表。</div></div><div class=card>${vodRows.length?vodRows.map((x,i)=>`<div class="source ${x.enabled?'':'off'}"><input class=check type=checkbox ${x.enabled?'checked':''} onchange="snapshot();vodRows[${i}].enabled=this.checked;render()"><div>${i+1}</div><div><div class=name>${esc(x.name)}</div><div class=url>${esc(x.url)}</div></div><div class=row><button class=small onclick="moveVod(${i},-1)">↑</button><button class=small onclick="moveVod(${i},1)">↓</button><button class=small onclick="editVod(${i})">修改</button><button class="small danger" onclick="delVod(${i})">删除</button></div></div>`).join(''):'<div class=empty>没有解析到 VOD_SERVERS</div>'}</div>`;
}
function addVod(){let n=prompt('站源名称');if(!n)return;let u=prompt('URL');if(!u)return;snapshot();vodRows.push({name:n,url:u,enabled:true});render()}
function editVod(i){let x=vodRows[i],n=prompt('名称',x.name),u=prompt('URL',x.url);if(n===null||u===null)return;snapshot();x.name=n;x.url=u;render()}
function delVod(i){if(!confirm('删除该 VOD 站源？'))return;snapshot();vodRows.splice(i,1);render()}
function moveVod(i,d){let j=i+d;if(j<0||j>=vodRows.length)return;snapshot();[vodRows[i],vodRows[j]]=[vodRows[j],vodRows[i]];render()}
function saveVodOnly(){saveAllSources()}
function renderOrder(){
 $('#content').innerHTML=`<div class=card><div class=toolbar><button class=green onclick="saveAllSources()">💾 保存排序</button><span class=muted>勾选=启用；未勾选=停用。↑↓ 控制 SOURCE_ORDER 的最终顺序。</span></div>${sourceDefs.map((x,i)=>`<div class="source ${x.enabled?'':'off'}"><input class=check type=checkbox ${x.enabled?'checked':''} onchange="snapshot();sourceDefs[${i}].enabled=this.checked"><div>${i+1}</div><div><div class=name>${esc(x.id)}</div><div class=url>SOURCE_ORDER</div></div><div></div><div class=row><button class=small onclick="moveAny('source','${esc(x.id)}',-1)">↑</button><button class=small onclick="moveAny('source','${esc(x.id)}',1)">↓</button><button class=small onclick="editAny('source','${esc(x.id)}')">修改</button><button class="small danger" onclick="deleteAny('source','${esc(x.id)}')">删除</button></div></div>`).join('')}</div>`;
}
function renderBrand(){
 let m=work.match(/yz\\s*=\\s*(["'])([\\s\\S]*?)\\1/), brand=m?jsUnquote(m[1]+m[2]+m[1]):'';
 let cats=[['api','🔗 API 配置'],['source','📜 源配置'],['match','🔍 匹配配置'],['danmu','🔢 弹幕配置'],['cache','💾 缓存配置'],['system','⚙️ 系统配置']];
 $('#content').innerHTML=`<div class=card><h3>📣 公众号 / 品牌文字</h3><input id=brand value="${esc(brand)}"><div style="height:10px"></div><button class=primary onclick="saveBrand()">保存品牌文字</button></div>
 <div class=card><h3>配置分类名称</h3>${cats.map(x=>`<div class=row style="margin:8px 0"><input value="${esc(x[0])}" disabled><input id="cat_${x[0]}" value="${esc(x[1])}"></div>`).join('')}<button onclick="saveCategoryNames()">保存分类名称</button></div>`;
}
function saveBrand(){let v=$('#brand').value;let r=/yz\\s*=\\s*(["'])([\\s\\S]*?)\\1/;if(!r.test(work))return alert('没有找到 yz 品牌文字变量');snapshot();work=work.replace(r,(m,q)=>'yz='+quote(v));setStatus('品牌/公众号文字已修改')}
function saveCategoryNames(){alert('分类名称在原文件中属于预览 UI 模板。此版本保留分类键和值的完整结构；如需直接改 UI 模板名称，请使用“精确模板编辑”功能。')}
function renderConfig(){
 let groups={api:['TOKEN','ADMIN_TOKEN','FAVORITE_REQUIRE_ADMIN','RATE_LIMIT_MAX_REQUESTS'],source:['SOURCE_ORDER','MERGE_SOURCE_PAIRS','CUSTOM_MERGE_RULES','OTHER_SERVER','CUSTOM_SOURCE_API_URL','VOD_SERVERS','VOD_RETURN_MODE','VOD_REQUEST_TIMEOUT','BILIBILI_COOKIE','DOUBAN_COOKIE','YOUKU_CONCURRENCY'],match:['PLATFORM_ORDER','STRICT_TITLE_MATCH','ENABLE_ANIME_EPISODE_FILTER','ANIME_TITLE_FILTER','EPISODE_TITLE_FILTER','TITLE_TO_CHINESE','ANIME_TITLE_SIMPLIFIED','TITLE_MAPPING_TABLE','AUTO_MATCH_MAPPING_TABLE','TITLE_NOISE_FILTER','AI_BASE_URL','AI_MODEL','AI_API_KEY','AI_MATCH_PROMPT','USE_BANGUMI_DATA'],danmu:['BLOCKED_WORDS','GROUP_MINUTE','DANMU_LIMIT','DANMU_SIMPLIFIED_TRADITIONAL','CONVERT_TOP_BOTTOM_TO_SCROLL','CONVERT_COLOR','COLOR_POOL','GRADIENT_CHANCE','GRADIENT_COLORS','LIKE_SWITCH','DANMU_OUTPUT_FORMAT','DANMU_PUSH_URL','DANMU_OFFSET','HONGGUO_MERGE_ALL_EPISODES'],cache:['SEARCH_CACHE_MINUTES','COMMENT_CACHE_MINUTES','COMMENT_CACHE_MIN_COUNT','BANGUMI_DATA_CACHE_DAYS','REMEMBER_LAST_SELECT','MAX_LAST_SELECT_MAP','MAX_ANIMES','UPSTASH_REDIS_REST_URL','UPSTASH_REDIS_REST_TOKEN','LOCAL_REDIS_URL'],system:['UI_THEME','LOG_LEVEL','PROXY_URL','TMDB_API_KEY','DEPLOY_PLATFROM_ACCOUNT','DEPLOY_PLATFROM_PROJECT','DEPLOY_PLATFROM_TOKEN','deployPlatform']};
 let cat=active==='config'?'source':'source', keys=groups[cat], rows=keys.map(k=>{let g=findGetDefault(k);return g?{k,g}:null}).filter(Boolean);

function editConfig(k){let g=findGetDefault(k);if(!g)return;let v=prompt('修改 '+k+' 的源码默认值',String(g.value));if(v===null)return;snapshot();work=work.slice(0,g.start)+quote(v)+work.slice(g.end);parseAll();render();setStatus(k+' 已修改')}
async function md5(buf){
 function rrot(x,n){return(x<<n)|(x>>>(32-n))}
 function add(x,y){return(((x>>>0)+(y>>>0))>>>0)}
 function cm(x,y,z){return(x&y)|(~x&z)}function fn(x,y,z){return(x&z)|(y&~z)}
 function hn(x,y,z){return x^y^z}function ii(x,y,z){return y^(x|~z)}
 let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
 let a=new Uint8Array(buf),l=a.length,n=((l+8>>>6)+1)*16,p=new Uint8Array(n*4);p.set(a);p[l]=128;let dv=new DataView(p.buffer);dv.setUint32(p.length-8,l*8,true);
 let k=[],s1=[7,12,17,22],s2=[5,9,14,20],s3=[4,11,16,23],s4=[6,10,15,21];
 for(let i=0;i<64;i++)k[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
 for(let off=0;off<p.length;off+=64){let m=[];for(let i=0;i<16;i++)m[i]=dv.getUint32(off+i*4,true);let A=a0,B=b0,C=c0,D=d0;
  for(let i=0;i<64;i++){let F,g,ss;if(i<16){F=cm(B,C,D);g=i;ss=s1[i%4]}else if(i<32){F=fn(B,C,D);g=(5*i+1)%16;ss=s2[i%4]}else if(i<48){F=hn(B,C,D);g=(3*i+5)%16;ss=s3[i%4]}else{F=ii(B,C,D);g=(7*i)%16;ss=s4[i%4]}
   let T=D;D=C;C=B;B=add(B,rrot(add(add(A,F),add(k[i],m[g])),ss));A=T}
  a0=add(a0,A);b0=add(b0,B);c0=add(c0,C);d0=add(d0,D)
 }
 let out='';for(let x of [a0,b0,c0,d0])for(let i=0;i<4;i++)out+=('0'+((x>>>8*i)&255).toString(16)).slice(-2);return out
}
async function downloadAll(){
 if(!work)return alert('请先打开 index.js');
 const bytes=new TextEncoder().encode(work),sum=await md5(bytes);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/javascript'}));a.download='index.js';a.click();
 const b=document.createElement('a');b.href=URL.createObjectURL(new Blob([sum+'  index.js\\n'],{type:'text/plain'}));b.download='index.js.md5';setTimeout(()=>b.click(),250);
 setStatus('已生成最终 index.js 与匹配的 index.js.md5 · MD5 '+sum)
}
