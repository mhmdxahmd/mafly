<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫源配置中心编辑器 V1</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#5b5bd6;--danger:#d33;--ok:#138a52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}
.wrap{max-width:1400px;margin:auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #00000008}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;color:var(--text);outline:none}
textarea{min-height:110px;resize:vertical}.wide{grid-column:1/-1}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#eef0ff;color:#34348e;font-weight:600}
button.primary{background:var(--primary);color:#fff}button.danger{background:#fff0f0;color:var(--danger)}button.ok{background:#eaf8f1;color:var(--ok)}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.layout{display:grid;grid-template-columns:210px 1fr;gap:16px}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:max-content;position:sticky;top:84px}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;margin:3px 0;text-align:left;background:transparent;color:var(--text)}
.cat.active{background:#eef0ff;color:#34348e}.count{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{max-width:420px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;margin:9px 0;padding:12px}
.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.key{font-weight:800;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.desc{color:var(--muted);font-size:12px;margin-top:4px}
.value{margin-top:10px;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:7px;padding:9px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;max-height:130px;overflow:auto}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#f0f2f5;color:#596174;font-size:11px;margin-left:6px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}
.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:18px}
.notice{padding:10px 12px;background:#fff8df;border:1px solid #f0df9b;border-radius:8px;color:#6d5a14;font-size:12px;margin-top:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
.hidden{display:none!important}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0">
<h1>猫源配置中心编辑器 V1</h1>
<div class="sub">读取 /api/config 的真实配置；修改、新增、删除环境变量。分类/类型/选项优先使用 index.js 返回的 envVarConfig。</div>
</div></header>

<main class="wrap">
<section class="card">
  <div class="grid">
    <div><label>猫源地址</label><input id="base" placeholder="https://example.com"></div>
    <div><label>普通 TOKEN（可选）</label><input id="token" placeholder="87654321"></div>
    <div><label>ADMIN_TOKEN（推荐）</label><input id="admin" placeholder="管理员令牌"></div>
    <div><label>index.js（可选，用于读取源码分类/类型）</label><input id="sourceFile" type="file" accept=".js,.txt"></div>
    <div class="wide">
      <div class="actions">
        <button class="primary" onclick="loadConfig()">读取配置中心</button>
        <button onclick="exportJson()">导出当前配置 JSON</button>
        <button onclick="importJson()">导入配置 JSON</button>
        <button onclick="addItem()">新增配置项</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>
  <div class="notice">
    注意：这个工具调用的是猫源自身的 <b>/api/config</b>、<b>/api/env/set</b>、<b>/api/env/add</b>、<b>/api/env/del</b> 接口。
    ADMIN_TOKEN 会参与 URL 路径，请不要把它公开发布。
  </div>
</section>

<div class="layout">
  <aside class="side">
    <button class="cat active" id="cat-all" onclick="selectCat('all')"><span>全部配置</span><span class="count" id="count-all">0</span></button>
    <div id="cats"></div>
  </aside>
  <section class="card" style="margin:0">
    <div class="toolbar">
      <input id="search" placeholder="搜索 KEY / 值 / 描述 / 分类" oninput="render()">
      <button onclick="addCategory()">新增本地分类</button>
    </div>
    <div id="list"><div class="status">请先读取配置中心。</div></div>
  </section>
</div>
</main>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2 id="mtitle">编辑配置项</h2>
  <div class="grid">
   <div><label>KEY</label><input id="fkey" spellcheck="false"></div>
   <div><label>分类</label><input id="fcat" placeholder="api/source/match/danmu/cache/system"></div>
   <div><label>类型</label>
    <select id="ftype" onchange="renderEditorOptions()">
      <option value="text">text</option><option value="number">number</option><option value="boolean">boolean</option><option value="select">select</option><option value="multi-select">multi-select</option><option value="map">map</option>
    </select>
   </div>
   <div><label>描述</label><input id="fdesc"></div>
   <div class="wide"><label>值</label><textarea id="fvalue"></textarea></div>
   <div class="wide hidden" id="optWrap"><label>可选项（逗号分隔）</label><input id="foptions"></div>
   <div><label>最小值</label><input id="fmin" type="number"></div>
   <div><label>最大值</label><input id="fmax" type="number"></div>
  </div>
  <div id="modalNotice" class="notice"></div>
  <div class="actions">
   <button class="primary" onclick="saveItem()">保存</button>
   <button onclick="closeModal()">取消</button>
   <button class="danger" id="delBtn" onclick="deleteCurrent()">删除</button>
  </div>
 </div>
</div>

<input id="importFile" type="file" accept=".json" class="hidden">

<script>
let config=null, items=[], activeCat='all', editing=null;
let localCats=JSON.parse(localStorage.getItem('catEditorLocalCats')||'[]');

const $=id=>document.getElementById(id);
function cleanBase(){return $('base').value.trim().replace(/\/+$/,'')}
function apiUrl(path,system=true){
  const base=cleanBase(); if(!base) throw Error('请先填写猫源地址');
  const admin=$('admin').value.trim(), token=$('token').value.trim();
  const t=system && admin ? admin : token;
  return base + '/' + (t ? encodeURIComponent(t)+'/' : '') + path.replace(/^\\//,'');
}
function setStatus(s,err=false){$('status').textContent=s; $('status').style.color=err?'#c33':''}
function jsonSafe(v){try{return JSON.parse(v)}catch{return null}}
function normalizeServerConfig(c){
  config=c||{};
  const vals=config.originalEnvVars||config.values||config.variables||{};
  const defs=config.envVarConfig||{};
  items=Object.keys(vals).map(k=>{
    const d=defs[k]||{};
    return {key:k,value:vals[k]??'',category:d.category||'system',type:d.type||'text',
      description:d.description||'',options:d.options||[],min:d.min,max:d.max};
  });
  // 如果接口没有返回某些变量定义，也保留真实值
}
async function loadConfig(){
  try{
    setStatus('正在读取 /api/config ...');
    const r=await fetch(apiUrl('/api/config',true),{headers:{'Accept':'application/json'}});
    const text=await r.text(); let c;
    try{c=JSON.parse(text)}catch{throw Error('返回的不是 JSON：'+text.slice(0,200))}
    if(!r.ok) throw Error('HTTP '+r.status+'：'+(c.errorMessage||c.message||text.slice(0,200)));
    normalizeServerConfig(c);
    renderCats(); render();
    setStatus('读取成功：'+items.length+' 项。');
  }catch(e){setStatus('读取失败：'+e.message,true)}
}
function selectCat(c){activeCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));$('cat-'+CSS.escape(c))?.classList.add('active');render()}
function renderCats(){
  const counts={};items.forEach(x=>counts[x.category]=(counts[x.category]||0)+1);
  $('count-all').textContent=items.length;
  const serverCats=[...new Set(items.map(x=>x.category))];
  const cats=[...new Set([...serverCats,...localCats])];
  $('cats').innerHTML=cats.map(c=>`<button class="cat" id="cat-${esc(c)}" onclick="selectCat('${js(c)}')"><span>${esc(catName(c))}</span><span class="count">${counts[c]||0}</span></button>`).join('');
}
function catName(c){
 const map={api:'🔗 API 配置',source:'📜 源配置',match:'🔍 匹配配置',danmu:'🔢 弹幕配置',cache:'💾 缓存配置',system:'⚙️ 系统配置'};
 return map[c]||c;
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const arr=items.filter(x=>(activeCat==='all'||x.category===activeCat)&&(!q||[x.key,x.value,x.description,x.category].join(' ').toLowerCase().includes(q)));
 $('list').innerHTML=arr.length?arr.map(x=>{
   const i=items.indexOf(x);
   return `<div class="item"><div class="item-head"><div><span class="key">${esc(x.key)}</span><span class="badge">${esc(x.type)}</span><span class="badge">${esc(catName(x.category))}</span><div class="desc">${esc(x.description)}</div></div><div class="actions" style="margin:0"><button onclick="editItem(${i})">编辑</button></div></div><div class="value">${esc(String(x.value))}</div></div>`;
 }).join(''):'<div class="status">没有匹配的配置。</div>';
}
function editItem(i){
 editing=i; const x=items[i]; $('mtitle').textContent='编辑配置项'; fill(x); $('delBtn').classList.remove('hidden'); $('modal').classList.add('show');
}
function addItem(){
 editing=null; $('mtitle').textContent='新增配置项'; fill({key:'',value:'',category:activeCat==='all'?'system':activeCat,type:'text',description:'',options:[],min:'',max:''});
 $('delBtn').classList.add('hidden');$('modal').classList.add('show');
}
function fill(x){
 $('fkey').value=x.key||'';$('fcat').value=x.category||'system';$('ftype').value=x.type||'text';$('fdesc').value=x.description||'';
 $('fvalue').value=String(x.value??'');$('foptions').value=(x.options||[]).join(',');$('fmin').value=x.min??'';$('fmax').value=x.max??'';
 renderEditorOptions();
 $('modalNotice').textContent=x.type==='multi-select'?'多选值使用逗号分隔；SOURCE_ORDER / PLATFORM_ORDER 等排序项可直接填写。':x.type==='map'?'映射表按每行 left->right 保存。':'';
}
function renderEditorOptions(){
 const t=$('ftype').value;
 $('optWrap').classList.toggle('hidden',!(t==='select'||t==='multi-select'));
}
function closeModal(){$('modal').classList.remove('show')}
async function saveItem(){
 const key=$('fkey').value.trim(), value=$('fvalue').value;
 if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)){alert('KEY 必须符合环境变量命名规则，例如 SOURCE_ORDER');return}
 const cat=$('fcat').value.trim()||'system', type=$('ftype').value;
 const data={key,value,category:cat,type,description:$('fdesc').value.trim(),options:$('foptions').value.split(',').map(x=>x.trim()).filter(Boolean)};
 try{
   setStatus('正在保存 '+key+' ...');
   let r=await fetch(apiUrl('/api/env/set',true),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})});
   let j=await r.json();
   if(!j.success){r=await fetch(apiUrl('/api/env/add',true),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})});j=await r.json()}
   if(!j.success)throw Error(j.message||j.errorMessage||'保存失败');
   if(editing===null)items.push(data);else items[editing]={...items[editing],...data};
   if(!localCats.includes(cat) && !['api','source','match','danmu','cache','system'].includes(cat)){localCats.push(cat);localStorage.setItem('catEditorLocalCats',JSON.stringify(localCats))}
   renderCats();render();closeModal();setStatus('保存成功：'+key);
 }catch(e){setStatus('保存失败：'+e.message,true)}
}
async function deleteCurrent(){
 if(editing===null)return;
 const x=items[editing];if(!confirm('确定删除 '+x.key+'？'))return;
 try{
   const r=await fetch(apiUrl('/api/env/del',true),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:x.key})});
   const j=await r.json();if(!j.success)throw Error(j.message||j.errorMessage||'删除失败');
   items.splice(editing,1);renderCats();render();closeModal();setStatus('已删除：'+x.key);
 }catch(e){setStatus('删除失败：'+e.message,true)}
}
function addCategory(){
 const n=prompt('输入本地分类名称，例如：4K、电视剧、我的配置');
 if(!n)return;const c=n.trim();if(!c)return;
 if(!localCats.includes(c))localCats.push(c);localStorage.setItem('catEditorLocalCats',JSON.stringify(localCats));renderCats();selectCat(c);
}
function exportJson(){
 const out={format:'cat-config-editor',version:1,exportedAt:new Date().toISOString(),values:{}};
 items.forEach(x=>out.values[x.key]=x.value);
 const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});downloadBlob(blob,'cat-config-export.json');
}
function importJson(){ $('importFile').click() }
$('importFile').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const d=JSON.parse(await f.text()), vals=d.values||d.variables||d.env||d;
  let ok=0;
  for(const [key,value] of Object.entries(vals)){
   if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)||value===null||typeof value==='object')continue;
   let r=await fetch(apiUrl('/api/env/set',true),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value:String(value)})});
   let j=await r.json(); if(!j.success){r=await fetch(apiUrl('/api/env/add',true),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value:String(value)})});j=await r.json()}
   if(j.success)ok++;
  }
  setStatus('导入完成：成功 '+ok+' 项。');await loadConfig();
 }catch(err){setStatus('导入失败：'+err.message,true)}
 e.target.value='';
});
$('sourceFile').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 // 这里仅做源码识别提示；真实分类/类型优先以 /api/config 返回的 envVarConfig 为准。
 const s=await f.text();
 const hits=(s.match(/envVarConfig/g)||[]).length;
 setStatus('已读取 index.js：发现 envVarConfig '+hits+' 处。点击“读取配置中心”即可按服务端实际配置加载。');
});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function downloadBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script>
</body>
</html>
